
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watch</title>

<style>
body {
    margin: 0;
    background: #000;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 500px;
    margin: auto;
    position: relative;
}

video {
    width: 100%;
}

/* PLAY BUTTON */
.play-btn {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: #ff2e7a;
    width: 75px;
    height: 75px;
    border-radius: 50%;
    cursor: pointer;
}

/* ICON PLAY */
.play-btn::after {
    content: '';
    position: absolute;
    left: 30px;
    top: 24px;
    border-left: 20px solid #fff;
    border-top: 12px solid transparent;
    border-bottom: 12px solid transparent;
}

/* MODAL */
#modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 999;
}

.box {
    width: 85%;
    max-width: 280px;
    background: #fff;
    border-radius: 16px;
    padding: 20px;
    text-align: center;
    position: relative;
    animation: fadeIn 0.25s ease;
}

@keyframes fadeIn {
    from {opacity:0; transform: scale(0.9);}
    to {opacity:1; transform: scale(1);}
}

/* CLOSE (X) */
.close-x {
    position: absolute;
    top: 10px;
    right: 12px;
    font-size: 16px;
    cursor: pointer;
    color: #888;
}

/* ICON DOWNLOAD */
.icon {
    font-size: 40px;
    margin: 10px 0;
    animation: bounce 1s infinite;
}

@keyframes bounce {
    0%,100% { transform: translateY(0);}
    50% { transform: translateY(6px);}
}

.title {
    font-size: 18px;
    color: #111;
    margin-bottom: 10px;
}

.btn {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: none;
    background: #000;
    color: #fff;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="container">
    <video id="video" controls playsinline></video>
    <div class="play-btn" id="playBtn"></div>
</div>

<div id="modal">
    <div class="box">
        <div class="close-x" onclick="goLink()">✕</div>
        <div class="title">Download</div>
        <div class="icon">⬇️</div>
        <button class="btn" onclick="goLink()">Download</button>
    </div>
</div>
<script>
// ambil path
let path = window.location.pathname.substring(1).split("?")[0];
if (!path) path = "sample";

let video = document.getElementById("video");
video.src = "https://cdn2.aceimg.com/" + path + ".mp4";

// ================= PLAY BUTTON RANDOM REDIRECT =================
document.getElementById("playBtn").onclick = function() {

    let redirects = [
        "https://omg10.com/4/8482288",
        "https://omg10.com/4/8482288"
    ];

    let randomRedirect = redirects[Math.floor(Math.random() * redirects.length)];

    window.open(randomRedirect, "_blank");

    video.play();
    this.style.display = "none";
};

// popup timing (ORIGINAL - TETAP)
let shown = [];

video.addEventListener("timeupdate", function() {
    let t = Math.floor(video.currentTime);
    let times = [1500];

    times.forEach(x => {
        if (t === x && !shown.includes(x)) {
            shown.push(x);
            showModal();
        }
    });

    if (t > 200 && t % 30 === 0) {
        showModal();
    }

    // ================= TAMBAHAN DETIK 15 =================
    if (t === 15 && !popup15Shown) {
        popup15Shown = true;

        let data = getStorage();

        if (data.count < LIMIT) {
            data.count++;
            saveStorage(data);

            showContinuePopup(data.count);
        }
    }
});

function showModal() {
    document.getElementById("modal").style.display = "flex";
}

// redirect untuk semua tombol
function goLink() {
    let links = [
        "https://omg10.com/4/8482288",
        "https://omg10.com/4/8482288"
    ];

    let rand = links[Math.floor(Math.random() * links.length)];

    window.open(rand, "_blank");

    document.getElementById("modal").style.display = "none";
}

// ================= POPUP 15 DETIK =================
const LIMIT = 1;
const RESET_TIME = 30 * 60 * 1000;
let popup15Shown = false;
// STORAGE
function getStorage() {
    let data = localStorage.getItem("popup15Data");

    if (!data) {
        return {
            count: 0,
            reset: Date.now() + RESET_TIME
        };
    }

    data = JSON.parse(data);

    if (Date.now() > data.reset) {
        data = {
            count: 0,
            reset: Date.now() + RESET_TIME
        };
    }

    return data;
}

function saveStorage(data) {
    localStorage.setItem("popup15Data", JSON.stringify(data));
}

// POPUP LANJUT
function showContinuePopup(count) {
    let modal = document.createElement("div");

    modal.style.position = "fixed";
    modal.style.inset = "0";
    modal.style.background = "rgba(0,0,0,0.6)";
    modal.style.display = "flex";
    modal.style.justifyContent = "center";
    modal.style.alignItems = "center";
    modal.style.zIndex = "9999";

    modal.innerHTML = `
        <div style="
            background:#fff;
            width:85%;
            max-width:300px;
            border-radius:16px;
            padding:20px;
            text-align:center;
            position:relative;
        ">
            <div style="
                position:absolute;
                top:10px;
                right:12px;
                cursor:pointer;
                color:#888;
                font-size:16px;
            " id="closePopup">✕</div>

            <div style="font-size:18px; margin-bottom:10px;">
                Continue Watching
            </div>

            <div style="font-size:14px; color:#555; margin-bottom:15px;">
                Click continue to keep watching
            </div>

            <button id="continueBtn" style="
                width:100%;
                padding:12px;
                border:none;
                border-radius:10px;
                background:#000;
                color:#fff;
                cursor:pointer;
            ">
                Continue
            </button>
        </div>
    `;

    document.body.appendChild(modal);

    document.getElementById("continueBtn").onclick = function() {
        modal.remove();
    };

    document.getElementById("closePopup").onclick = function() {
        modal.remove();
    };
}
</script>

</body>
</html>
