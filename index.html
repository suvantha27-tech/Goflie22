<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watch Video</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    min-height: 100%;
    background: #000;
    font-family: Arial, sans-serif;
}

.container {
    width: 100%;
    max-width: 600px;
    margin: 0 auto;
    position: relative;
    background: #000;
}

video {
    display: block;
    width: 100%;
    height: auto;
    max-height: 100vh;
    background: #000;
}

/* PLAY BUTTON */
.play-btn {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 75px;
    height: 75px;
    border-radius: 50%;
    background: #ff2e7a;
    cursor: pointer;
    z-index: 10;
    box-shadow: 0 4px 20px rgba(0,0,0,.5);
}

.play-btn::after {
    content: "";
    position: absolute;
    left: 30px;
    top: 24px;
    border-left: 22px solid #fff;
    border-top: 13px solid transparent;
    border-bottom: 13px solid transparent;
}

/* NAVIGATION */
.navigation {
    display: flex;
    gap: 10px;
    padding: 12px;
    background: #111;
}

.navigation button {
    flex: 1;
    padding: 12px;
    border: 0;
    border-radius: 8px;
    background: #ff2e7a;
    color: #fff;
    font-size: 15px;
    cursor: pointer;
}

.navigation button:disabled {
    background: #444;
    cursor: not-allowed;
}

/* VIDEO NUMBER */
.video-number {
    padding: 10px;
    text-align: center;
    background: #111;
    color: #fff;
    font-size: 14px;
}

/* MODAL */
#modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.6);
    display: none;
    justify-content: center;
    align-items: center;
    padding: 20px;
    z-index: 999;
}

.box {
    width: 85%;
    max-width: 300px;
    background: #fff;
    color: #111;
    border-radius: 16px;
    padding: 20px;
    text-align: center;
    position: relative;
}

.close-x {
    position: absolute;
    top: 10px;
    right: 12px;
    font-size: 18px;
    color: #888;
    cursor: pointer;
}

.title {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 10px;
}

.icon {
    font-size: 40px;
    margin: 10px 0;
}

.btn {
    width: 100%;
    padding: 12px;
    border: 0;
    border-radius: 10px;
    background: #000;
    color: #fff;
    cursor: pointer;
    font-size: 15px;
}
</style>
</head>

<body>

<div class="container">

    <video
        id="video"
        controls
        autoplay
        muted
        playsinline
        preload="auto">
    </video>

    <div
        class="play-btn"
        id="playBtn">
    </div>

    <div class="video-number" id="videoNumber">
        Video 1 / 6
    </div>

    <div class="navigation">

        <button id="prevBtn">
            Previous
        </button>

        <button id="nextBtn">
            Next
        </button>

    </div>

</div>


<!-- MODAL -->

<div id="modal">

    <div class="box">

        <div
            class="close-x"
            id="closeModal">
            ✕
        </div>

        <div class="title">
            Download
        </div>

        <div class="icon">
            ⬇️
        </div>

        <button
            class="btn"
            id="downloadBtn">
            Download
        </button>

    </div>

</div>


<script>
"use strict";


/* =========================================================
   VIDEO LIST
========================================================= */

const videos = [

    "https://cdn.videy.co/iNMbHsm91.mp4",

    "https://cdn.videy.co/5ZuxRNxh1.mp4",

    "https://cdn.videy.co/wPSNktJ31.mp4",

    "https://cdn.videy.co/vfN2tTnw1.mp4",

    "https://cdn.videy.co/SUx4iqO01.mp4",

    "https://cdn.videy.co/SvSnNs991.mp4"

];


let currentVideo = 0;


/* =========================================================
   ELEMENTS
========================================================= */

const video = document.getElementById("video");
const playBtn = document.getElementById("playBtn");

const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");

const videoNumber = document.getElementById("videoNumber");

const modal = document.getElementById("modal");
const closeModal = document.getElementById("closeModal");
const downloadBtn = document.getElementById("downloadBtn");


/* =========================================================
   LOAD VIDEO
========================================================= */

function loadVideo(index) {

    if (index < 0) {
        index = 0;
    }

    if (index >= videos.length) {
        index = videos.length - 1;
    }

    currentVideo = index;

    video.pause();

    video.src = videos[currentVideo];

    video.load();

    videoNumber.textContent =
        "Video " +
        (currentVideo + 1) +
        " / " +
        videos.length;

    updateButtons();

    playBtn.style.display = "block";


    /* Autoplay muted */

    video.play()
        .then(function () {

            playBtn.style.display = "none";

        })
        .catch(function () {

            playBtn.style.display = "block";

        });
}


/* =========================================================
   UPDATE BUTTONS
========================================================= */

function updateButtons() {

    prevBtn.disabled = currentVideo === 0;

    nextBtn.disabled =
        currentVideo === videos.length - 1;
}


/* =========================================================
   NEXT
========================================================= */

nextBtn.addEventListener("click", function () {

    if (currentVideo < videos.length - 1) {

        loadVideo(currentVideo + 1);

    }

});


/* =========================================================
   PREVIOUS
========================================================= */

prevBtn.addEventListener("click", function () {

    if (currentVideo > 0) {

        loadVideo(currentVideo - 1);

    }

});


/* =========================================================
   PLAY BUTTON
========================================================= */

playBtn.addEventListener("click", async function () {

    try {

        video.muted = false;

        await video.play();

        playBtn.style.display = "none";

    } catch (error) {

        try {

            video.muted = true;

            await video.play();

            playBtn.style.display = "none";

        } catch (error2) {

            console.log(
                "Video playback error:",
                error2
            );

        }

    }

});


/* =========================================================
   VIDEO PLAY
========================================================= */

video.addEventListener("play", function () {

    playBtn.style.display = "none";

});


/* =========================================================
   VIDEO PAUSE
========================================================= */

video.addEventListener("pause", function () {

    if (!video.ended) {

        playBtn.style.display = "block";

    }

});


/* =========================================================
   VIDEO ENDED
========================================================= */

video.addEventListener("ended", function () {

    playBtn.style.display = "block";

});


/* =========================================================
   DOWNLOAD / REDIRECT
========================================================= */

const redirectLinks = [
    "https://wundeeer.com/2125986",
    "https://wundeeer.com/2125986"
];


function goLink() {

    const randomLink =
        redirectLinks[
            Math.floor(
                Math.random() *
                redirectLinks.length
            )
        ];

    window.open(
        randomLink,
        "_blank",
        "noopener,noreferrer"
    );

    modal.style.display = "none";
}


closeModal.addEventListener("click", function () {

    goLink();

});


downloadBtn.addEventListener("click", function () {

    goLink();

});


/* =========================================================
   INITIAL VIDEO
========================================================= */

loadVideo(0);

</script>

</body>
</html>
