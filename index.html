    var bl=sz/7;for(var y=0;y<7;y++)for(var x=0;x<7;x++){var v=Math.abs(h*(y*7+x+3))%5;if(v<1){cx.fillStyle='hsl('+((hu+90)%360)+',55%,55%)';cx.fillRect(x*bl,y*bl,bl,bl)}else if(v<2){cx.fillStyle='hsl('+((hu+180)%360)+',55%,55%)';cx.fillRect(x*bl,y*bl,bl,bl)}else if(v<3){cx.fillStyle='hsl('+((hu+270)%360)+',55%,40%)';cx.fillRect(x*bl,y*bl,bl,bl)}}
    return cv.toDataURL();
}

function api(a,p,m){
    m=m||'POST';
    var o={method:m,headers:{'Content-Type':'application/json'}};
    if(m==='POST'&&Object.keys(p).length)o.body=JSON.stringify(p);
    var u=new URL('api.php',location.origin);u.searchParams.set('action',a);
    if(m==='GET'){var keys=Object.keys(p);for(var i=0;i<keys.length;i++){u.searchParams.set(keys[i],p[keys[i]])}}
    return fetch(u.toString(),o).then(function(r){return r.json()}).catch(function(e){return{status:'error',message:'Network error'}});
}

function initAcct(){
    return api('getAccount',{token:S.token},'GET').then(function(r){
        if(r.status==='ok'){
            S.root=r.rootFolder;
            if(C.isAdmin) api('setPublicRoot',{folderId:r.rootFolder},'POST');
            renderAcct(r);return true;
        }
        S.token='';localStorage.removeItem('cv_tk');
        return api('createAccount',{}).then(function(r){
            if(r.status==='ok'){
                S.token=r.token;S.root=r.rootFolder;localStorage.setItem('cv_tk',S.token);
                if(C.isAdmin) api('setPublicRoot',{folderId:r.rootFolder},'POST');
                return api('getAccount',{token:S.token},'GET');
            }
            return null;
        }).then(function(r){if(r&&r.status==='ok')renderAcct(r);return true});
    });
}

    h+='<div class="min-w-8"><div class="relative inline-flex"><i class="fas '+fi.i+' '+fi.c+' text-2xl mr-2"></i></div></div>';

    if(pl){

        h+='<button class="gfm-close-btn item_close" data-id="'+it.id+'"><i class="fas fa-xmark"></i></button>';

function attachEvts(){
    var c=document.getElementById('filemanager');
    c.querySelectorAll('.item_checkbox').forEach(function(cb){cb.onchange=function(e){e.stopPropagation();togSel(this.dataset.id)}});
    c.querySelectorAll('.item_open').forEach(function(a){a.onclick=function(e){e.stopPropagation();var id=this.dataset.id;var it=S.items.find(function(i){return i.id===id});if(it&&it.itemType==='folder')navTo(it.id)}});
    c.querySelectorAll('.item_play').forEach(function(b){b.onclick=function(e){e.stopPropagation();playM(this.dataset.id)}});
    c.querySelectorAll('.item_close').forEach(function(b){b.onclick=function(e){e.stopPropagation();closeMedia(this.dataset.id)}});
    c.querySelectorAll('.item_download').forEach(function(b){b.onclick=function(e){e.stopPropagation();dlF(this.dataset.id)}});
    c.querySelectorAll('.dd-tog').forEach(function(btn){btn.onclick=function(e){e.stopPropagation();togDD(this)}});
    c.querySelectorAll('.dd-a').forEach(function(a){a.addEventListener('click',function(e){e.stopPropagation();handleDDAction(this)})});
}

function handleDDAction(el){
    var dd=el.closest('.dd');if(!dd)return;
    var cls=el.classList;
    if(cls.contains('item_download'))dlF(el.dataset.id);
    else if(cls.contains('item_play'))playM(el.dataset.id);
    else if(cls.contains('item_close'))closeMedia(el.dataset.id);
    else if(cls.contains('dd-ren')){var it=S.items.find(function(i){return i.id===el.dataset.id});if(it)showRename(it)}
    else if(cls.contains('dd-del'))delOne(el.dataset.id,el.dataset.type);
    else if(cls.contains('dd-copy'))toast('Copy feature coming soon','info');
    else if(cls.contains('dd-move'))toast('Move feature coming soon','info');
    else if(cls.contains('dd-prop'))toast('Properties coming soon','info');
    dd.classList.remove('open');
}

function updPlayBtns(row,id,playing){
    row.querySelectorAll('.item_play').forEach(function(b){b.style.display=playing?'none':'flex'});
    row.querySelectorAll('.item_close').forEach(function(b){b.style.display=playing?'flex':'none'});
    row.querySelectorAll('.gfm-play-btn.item_play').forEach(function(b){b.style.display=playing?'none':'flex'});
    row.querySelectorAll('.gfm-close-btn.item_close').forEach(function(b){b.style.display=playing?'flex':'none'});
    row.querySelectorAll('.dd-a.item_play').forEach(function(a){a.classList.toggle('hidden',playing)});
    row.querySelectorAll('.dd-a.item_close').forEach(function(a){a.classList.toggle('hidden',!playing)});
}

// ── Media Playback (kode lama - berfungsi) ──
function playM(id){
    var it=S.items.find(function(i){return i.id===id});
    if(!it||!playable(it.type))return;
    S.playing.add(id);
    var row=document.querySelector('[data-item-id="'+id+'"]');
    if(!row)return;

    if(it.type.startsWith('video/')){
        row.classList.add('is-playing');
        var preview=row.querySelector('.gfm-preview');
        var video=preview.querySelector('video');
        var originalUrl=preview.getAttribute('data-video');
        var nameEl=row.querySelector('.file-name-gfm');
        if(nameEl)nameEl.innerText=nameEl.getAttribute('data-short');
        video.setAttribute('controls','true');
        video.removeAttribute('muted');
        video.src=originalUrl;
        video.play();
        updPlayBtns(row,id,true);updPlayAllBtn();return;
    }

    // AUDIO
    var mp=row.querySelector('.item-mediaplayer');
    if(!mp)return;
    var streamUrl=C.url+'/f/'+id+'?stream=1';
    var tmp=document.createElement('div');
    tmp.innerHTML='<audio controls autoplay class="w-full max-w-lg"><source src="'+streamUrl+'" type="'+it.type+'"></audio>';
    mp.classList.remove('hidden');
    while(tmp.firstChild)mp.appendChild(tmp.firstChild);
    updPlayBtns(row,id,true);updPlayAllBtn();
}

function closeMedia(id){
    var it=S.items.find(function(i){return i.id===id});

    if(it&&it.type.startsWith('video/')){
        S.playing.delete(id);
        var row=document.querySelector('[data-item-id="'+id+'"]');
        if(!row){updPlayAllBtn();return}
        row.classList.remove('is-playing');
        var preview=row.querySelector('.gfm-preview');
        var video=preview.querySelector('video');
        var originalUrl=preview.getAttribute('data-video');
        var nameEl=row.querySelector('.file-name-gfm');
        if(nameEl)nameEl.innerText=nameEl.getAttribute('data-full');
        video.pause();
        video.removeAttribute('controls');
        video.setAttribute('muted','');
        video.src=originalUrl+'#t=0.5';
        video.load();
        updPlayBtns(row,id,false);updPlayAllBtn();return;
    }

    if(it&&it.type.startsWith('audio/')){
        S.playing.delete(id);
        var row=document.querySelector('[data-item-id="'+id+'"]');
        if(!row){updPlayAllBtn();return}
        var mp=row.querySelector('.item-mediaplayer');
        if(mp){var v=mp.querySelector('audio');if(v){v.pause();v.removeAttribute('src');v.load()}mp.innerHTML='';mp.classList.add('hidden')}
        updPlayBtns(row,id,false);updPlayAllBtn();
    }
}

function handleThumbClick(previewBox){
    var row=previewBox.closest('.gfm-video-row');
    if(!row||row.classList.contains('is-playing'))return;
    var playBtn=row.querySelector('.item_play');
    if(playBtn)playM(playBtn.dataset.id);
}

function closeAllMedia(){S.playing.forEach(function(id){closeMedia(id)})}
function playAll(){S.items.forEach(function(it){if(it.itemType==='file'&&playable(it.type)&&!S.playing.has(it.id))playM(it.id)})}
function updPlayAllBtn(){
    var has=S.items.some(function(i){return i.itemType==='file'&&playable(i.type)});
    var all=has&&S.items.every(function(i){return i.itemType==='folder'||!playable(i.type)||S.playing.has(i.id)});
    var pa=document.getElementById('fmPlayAll');if(pa)pa.classList.toggle('hidden',all);
    var ca=document.getElementById('fmCloseAll');if(ca)ca.classList.toggle('hidden',!all);
}

// ── Sort, Selection, Actions (kode lama - berfungsi) ──
function doSortBy(k){if(S.sort===k)S.sortD*=-1;else{S.sort=k;S.sortD=1}doSort();renderFm()}
function doSort(){
    var k=S.sort,d=S.sortD;
    S.items.sort(function(a,b){
        if(a.itemType!==b.itemType)return a.itemType==='folder'?-1:1;
        if(k==='name')return a.name.toLowerCase().localeCompare(b.name.toLowerCase())*d;
        if(k==='size')return((a.size||0)-(b.size||0))*d;
        if(k==='created')return((a.created||0)-(b.created||0))*d;
        if(k==='type')return(a.type||'').localeCompare(b.type||'')*d;
        return 0;
    });
}

function togSel(id){if(S.sel.has(id))S.sel.delete(id);else S.sel.add(id);updSelUI();updCbVis(id)}
function selAllCb(c){if(c)S.items.forEach(function(i){S.sel.add(i.id)});else S.sel.clear();updSelUI();document.querySelectorAll('.item_checkbox').forEach(function(cb){cb.checked=c})}
function updSelUI(){
    var n=S.sel.size;
    var badge=document.getElementById('selBadge'),dl=document.getElementById('batchDl'),del=document.getElementById('batchDel');
    if(n>0){badge.classList.remove('hidden');document.getElementById('selBadgeV').textContent=n;dl.classList.remove('hidden');del.classList.remove('hidden')}
    else{badge.classList.add('hidden');dl.classList.add('hidden');del.classList.add('hidden')}

function showRenameFm(){if(S.finfo)showRename({id:S.finfo.id,name:S.finfo.name,type:'folder'})}
function showRename(it){

function doRename(id,type){

function delOne(id,type){S.sel.clear();S.sel.add(id);showDelConf(1)}
function delSel(){if(!S.sel.size)return;showDelConf(S.sel.size)}
function showDelConf(n){
    modal('<i class="fas fa-trash mr-2 text-red-400"></i> Confirm Delete',
    '<p class="text-gray-300 text-sm">Delete <strong>'+n+'</strong> item'+(n>1?'s':'')+'?</p><p class="text-gray-500 text-xs mt-2">Cannot be undone.</p>',
    '<button onclick="closeM()" class="px-4 py-2 bg-gray-700 hover:bg-gray-600 text-white rounded-lg text-sm">Cancel</button><button onclick="confirmDel()" class="px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded-lg text-sm font-medium">Delete</button>');
}
function confirmDel(){
    closeM();var ids=Array.from(S.sel);var err=0;var idx=0;
    function delNext(){
        if(idx>=ids.length){S.sel.clear();closeAllMedia();if(err===0)toast('Deleted','success');else toast(err+' error(s)','warning');loadFm(S.fid);return}
        var it=S.items.find(function(x){return x.id===ids[idx]});idx++;
        if(!it){delNext();return}
        api('deleteItem',{token:S.token,id:it.id,type:it.itemType}).then(function(r){if(r.status!=='ok')err++;delNext()});
    }
    delNext();
}
function delFolder(){if(!S.finfo)return;S.sel.clear();S.sel.add(S.finfo.id);showDelConf(1)}

function handleFiles(files){
    if(!files||!files.length)return;
    if(!C.isAdmin){toast('Only admin can upload','warning');return}
    doUpload(files);
    document.getElementById('fInput').value='';
    var h=document.getElementById('fInputHome');if(h)h.value='';
}
function doUpload(fileList){
    var ua=document.getElementById('upArea'),ul=document.getElementById('upList');ua.classList.remove('hidden');
    var fd=new FormData();var has=false;
    Array.from(fileList).forEach(function(f){
        if(f.size>C.maxSz){toast('"'+f.name+'" too large','warning');return}
        fd.append('files[]',f);has=true;
        var uid='up_'+(++S.upN);S.ups.set(uid,{f:f.name,st:'up'});
        var el=document.createElement('div');el.id=uid;el.className='flex items-center gap-3 bg-gray-700/50 rounded-lg px-3 py-1.5';
        el.innerHTML='<i class="fas fa-file text-gray-400 flex-shrink-0"></i><div class="flex-1 min-w-0"><div class="text-xs truncate text-gray-300">'+esc(f.name)+'</div><div class="w-full bg-gray-600 rounded-full h-1 mt-1"><div class="bg-blue-500 h-1 rounded-full pbar" style="width:0%"></div></div></div><span class="text-xs text-gray-500 flex-shrink-0 ust">0%</span>';
        ul.appendChild(el);
    });
    if(!has){if(!S.ups.size)ua.classList.add('hidden');return}
    if(S.token)fd.append('token',S.token);
    if(S.fid)fd.append('folder',S.fid);
    var xhr=new XMLHttpRequest();xhr.open('POST',C.url+'/upload.php');
    xhr.upload.onprogress=function(e){
        if(e.lengthComputable){var p=Math.round(e.loaded/e.total*100);S.ups.forEach(function(v,u){if(v.st==='up'){var el=document.getElementById(u);if(el){el.querySelector('.pbar').style.width=p+'%';el.querySelector('.ust').textContent=p+'%'}}})}
    };
    xhr.onload=function(){
        try{var r=JSON.parse(xhr.responseText);
            if(r.status==='ok'){
                S.ups.forEach(function(v,u){v.st='done';var el=document.getElementById(u);if(el){el.querySelector('.pbar').style.width='100%';el.querySelector('.pbar').classList.replace('bg-blue-500','bg-emerald-500');el.querySelector('.ust').innerHTML='<i class="fas fa-check text-emerald-400"></i>'}});
                if(r.errors&&r.errors.length)r.errors.forEach(function(e){toast(e.name+': '+e.error,'warning')});
                if(!S.fid&&r.folderId){showSuccessCard(r.folderId,r.files)}
                else if(S.fid)setTimeout(function(){loadFm(S.fid)},500);
            }else{
                S.ups.forEach(function(v,u){v.st='err';var el=document.getElementById(u);if(el){el.querySelector('.pbar').classList.replace('bg-blue-500','bg-red-500');el.querySelector('.ust').innerHTML='<i class="fas fa-xmark text-red-400"></i>'}});
                toast(r.message||'Failed','error');
            }
        }catch(e){toast('Failed','error')}
    };
    xhr.onerror=function(){
        S.ups.forEach(function(v,u){v.st='err';var el=document.getElementById(u);if(el){el.querySelector('.pbar').classList.replace('bg-blue-500','bg-red-500');el.querySelector('.ust').innerHTML='<i class="fas fa-xmark text-red-400"></i>'}});
        toast('Network error','error');
    };
    xhr.send(fd);
}
function clearDone(){
    var rm=[];S.ups.forEach(function(v,u){if(v.st==='done'||v.st==='err'){rm.push(u);var el=document.getElementById(u);if(el)el.remove()}});
    rm.forEach(function(u){S.ups.delete(u)});
    if(!S.ups.size)document.getElementById('upArea').classList.add('hidden');
}

document.addEventListener('dragover',function(e){e.preventDefault()});
document.addEventListener('drop',function(e){
    e.preventDefault();
    if(!e.target.closest('#homeUp')&&S.fid&&S.own&&C.isAdmin&&e.dataTransfer.files.length)doUpload(e.dataTransfer.files);
});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeM();if(e.key==='Delete'&&S.sel.size>0&&S.own)delSel()});
