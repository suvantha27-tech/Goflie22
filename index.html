<script>
const video = document.getElementById("video");
const playBtn = document.getElementById("playBtn");

// Get video path
let path = window.location.pathname.substring(1).split("?")[0];

if (!path) {
    path = "sample";
}

// Video URL
video.src = "https://cdn2.aceimg.com/" + path + ".mp4";

// Try autoplay
video.muted = true;

video.play().then(() => {
    playBtn.style.display = "none";
}).catch(() => {
    // Browser blocked autoplay
    playBtn.style.display = "block";
});

// Play button
playBtn.addEventListener("click", async function () {
    try {
        video.muted = false;
        await video.play();

        playBtn.style.display = "none";
    } catch (error) {
        // If sound autoplay is blocked, play muted
        video.muted = true;
        await video.play();

        playBtn.style.display = "none";
    }
});

// Show button when video is paused
video.addEventListener("pause", function () {
    if (!video.ended) {
        playBtn.style.display = "block";
    }
});

// Hide button when video plays
video.addEventListener("play", function () {
    playBtn.style.display = "none";
});
</script>
